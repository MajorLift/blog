<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<style>
:root {
  --bg: #fdfdfc;
  --fg: #1a1a1a;
  --muted: #6b6b6b;
  --rule: #e4e2dd;
  --link: #1a5276;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a;
    --fg: #d8d5cf;
    --muted: #8a8a8a;
    --rule: #2c2f33;
    --link: #7fb3d5;
  }
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  line-height: 1.65;
}
main {
  max-width: 42rem;
  margin: 0 auto;
  padding: 4rem 1.25rem 3rem;
}
h1, h2, h3 { line-height: 1.25; }
h1 { font-size: 1.7rem; margin: 0 0 0.4rem; }
h2 { font-size: 1.25rem; margin-top: 2.2rem; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
.site-header h1 a { color: var(--fg); }
.site-header p { color: var(--muted); margin-top: 0; }
.post-list { list-style: none; padding: 0; margin: 2.5rem 0; }
.post-list li { margin-bottom: 1.6rem; }
.post-list time { display: block; font-size: 0.85rem; color: var(--muted); }
.post-list a { font-size: 1.15rem; }
.post-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
article table {
  display: block; overflow-x: auto;
  border-collapse: collapse; font-size: 0.9rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
article th, article td { border: 1px solid var(--rule); padding: 0.4rem 0.6rem; text-align: left; }
article blockquote { border-left: 3px solid var(--rule); margin-left: 0; padding-left: 1rem; color: var(--muted); }
article img { max-width: 100%; }
code, pre { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.88em; }
footer { color: var(--muted); font-size: 0.9rem; }
footer a { color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
<main>
{{ content }}
<hr>
<footer>
<a href="https://github.com/MajorLift">github</a> · <a href="{{ '/feed.xml' | relative_url }}">rss</a>
</footer>
</main>
</body>
</html>
